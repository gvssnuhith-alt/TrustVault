services:
  - type: web
    name: trustvault-backend
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trustvault-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: STORAGE_PATH
        value: /tmp/trustvault_storage

databases:
  - name: trustvault-db
    plan: free
    region: oregon
    databaseName: trustvault
    user: trustvault_user
